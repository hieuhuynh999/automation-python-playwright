[project]
name = "efms-etms-automation"
version = "1.0.0"
description = "Automation framework for eFMS/eTMS using pytest and Playwright"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "playwright>=1.52.0",
    "pydantic-settings>=2.9.1",
    "pytest>=8.4.0",
    "pytest-html>=4.1.1",
    "pytest-metadata>=3.1.1",
    "pytest-reportportal>=5.6.8",
    "pytest-rerunfailures>=15.1",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.401",
    "pytest-xdist>=3.7.0",
    "ruff>=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
rp_endpoint = "http://localhost:8080"
rp_project = "default_personal"
rp_verify_ssl = "false"
markers = [
    "efms: eFMS application tests",
    "etms: eTMS application tests",
    "smoke: smoke test suite",
    "login: login test suite",
    "navigation: navigation test suite",
    "regression: regression test suite",
    "critical: Critical priority tests",
    "high: High priority tests",
    "medium: Medium priority tests",
    "low: Low priority tests",
    "tc_id(id): Test Case ID",
    "description(text): Test case description",
    "debug: debug-only tests (not part of regression suite)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
